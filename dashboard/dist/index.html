<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Reference-Data Consistency — Live Demo</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --red: #f85149;
        --amber: #d29922;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
      .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .grid { display: grid; gap: 16px; }
      .cols-3 { grid-template-columns: repeat(3, 1fr); }
      .cols-2 { grid-template-columns: repeat(2, 1fr); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .metric { font-size: 28px; font-weight: 700; }
      .metric small { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
      .site-card { border-left: 3px solid var(--accent); }
      .site-card.lagging { border-left-color: var(--red); }
      .site-card.ahead { border-left-color: var(--green); }
      .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
      .row .k { color: var(--muted); }
      button {
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: #1f6feb; border-color: #1f6feb; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select {
        background: #0d1117;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.none { background: #1b2a1e; color: var(--green); }
      .badge.low { background: #2a241b; color: var(--amber); }
      .badge.moderate { background: #2a241b; color: var(--amber); }
      .badge.severe { background: #3a1d1d; color: var(--red); }
      .badge.critical { background: #4a1414; color: #ff6b6b; }
      .badge.provisional { background: #2a241b; color: var(--amber); margin-left: 6px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; }
      .event-log { max-height: 300px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; }
      .event-log div { padding: 3px 0; border-bottom: 1px solid #21262d; }
      .ok { color: var(--green); }
      .err { color: var(--red); }
      .warn { color: var(--amber); }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
      .comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .result-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
      .result-card.match { border-color: var(--green); }
      .result-card.mismatch { border-color: var(--red); }
      .footer-note { color: var(--muted); font-size: 11px; margin-top: 16px; }
    </style>
    <script type="module" crossorigin src="/assets/index-Cu4C8OxW.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
